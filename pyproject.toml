[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forecastlib"]

[project]
name = "forecastlib"
version = "0.1.0"
description = "Lightning-based time series forecasting models, data loaders and utilities."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10, <3.14"
dependencies = [
    "einops>=0.8.1",
    "lightning>=2.3.3",
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "plotly>=6.3.0",
    "pyyaml>=6.0",
    "pywavelets>=1.4.1",
    "reformer-pytorch>=1.4.4",
    "scikit-learn>=1.3.2",
    "scipy>=1.10.1",
    "statsmodels>=0.14.1",
    "sympy>=1.13.3",
    "torch>=2.4.1",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
# Database logging + Dash dashboard (forecastlib.database, forecastlib.dashboard, forecastlib.app)
database = [
    "dash>=3.3.0",
    "dash-bootstrap-components>=1.6.0",
    "oracledb>=3.0.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.44",
]
# Non-torch model wrappers (forecastlib.models.WrapperClasses)
wrappers = [
    "pastas>=1.4.0",
    "xgboost>=2.1.4",
]
# The Mamba model (forecastlib.models.Mamba) needs a CUDA build of mamba-ssm.
# Installed separately on purpose; MambaSimple works without it.
#mamba = [
#    "mamba-ssm>=2.0.0",
#]

dev = [
    "deptry>=0.24.0",
    "poethepoet>=0.42.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.poe.tasks]
"format:fmt" = "uv run ruff format"
"format:lint" = "uv run ruff check --fix"
format = ["format:fmt", "format:lint"]
"lint:fmt" = "uv run ruff format --check"
"lint:lint" = "uv run ruff check"
lint = ["lint:fmt", "lint:lint"]
test = "uv run pytest -vvv"
sync = "uv sync"
lock = "uv lock"

[tool.ruff]
line-length = 120
lint.select = ["ALL"]
lint.ignore = [
    "TD",
    "FIX",
    "PD",
    "PERF",
    "G004",
    "COM812",
    "S301",
    "S506",
    "T201",
    "ANN401",
]
include = ["forecastlib/**/*.py", "tests/**/*.py"]
# Upstream model/layer implementations are kept close to their papers; don't lint them.
extend-exclude = [
    "forecastlib/layers/**/*.py",
    "forecastlib/models/**/*.py",
]
